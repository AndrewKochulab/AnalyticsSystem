included:
  - Sources
  - Tests

excluded:
  - .build
  - IntegrationTests/ProviderBuild/.build

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

analyzer_rules:
  - unused_import

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 60
  error: 100

identifier_name:
  min_length: 2
  excluded: [id, to]

nesting:
  type_level: 2

# The library must never reintroduce the v1 crashers.
force_cast: error
force_try: error
force_unwrapping: error

custom_rules:
  no_fatal_error:
    name: "No fatalError in library code"
    regex: "fatalError\\("
    match_kinds: [identifier]
    message: "v1 shipped fatalError initializers reachable from public API. Model the failure in the type system instead."
    severity: error
